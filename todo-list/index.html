<body>

        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"
                class="me-1">
                <path
                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z" />

              GitHub
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="mb-4">
          <h1 class="display-5 fw-bold text-body-emphasis">Todo List</h1>
          <p class="text-body-secondary">Create and manage your tasks with persistent storage.</p>
        </div>

        <div class="card mb-4">
          <div class="card-body">
            <div class="mb-3">
              <div class="input-group">
                <input type="text" class="form-control" id="new-todo-input" placeholder="Add a new task..."
                  maxlength="200">
                <button class="btn btn-primary" type="button" id="add-todo-btn">Add Task</button>
              </div>
            </div>

            <div class="mb-3">
              <div class="btn-group-sm" role="group">
                <input type="radio" class="btn-check" name="filter" id="filter-all" autocomplete="off" checked>
                <label class="btn btn-outline-secondary" for="filter-all">All</label>
                <input type="radio" class="btn-check" name="filter" id="filter-active" autocomplete="off">
                <label class="btn btn-outline-secondary" for="filter-active">Active</label>
                <input type="radio" class="btn-check" name="filter" id="filter-completed" autocomplete="off">
                <label class="btn btn-outline-secondary" for="filter-completed">Completed</label>
              </div>
              <div class="float-end">
                <button class="btn btn-outline-danger btn-sm" id="clear-completed-btn">Clear Completed</button>
              </div>
            </div>

            <div id="todo-list" class="list-group">
              <!-- Todos will be inserted here -->
            </div>

            <div id="empty-state" class="text-center text-muted py-5 d-none">
              <p class="mb-0">No tasks yet. Add one above to get started!</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-auto">
    <div class="container">
      <div class="text-center">
        <span class="text-body-secondary small">Made with AI & ❤️ by <a href="https://gavineke.com" target="_blank"
            rel="noopener">Gavin Eke</a></span>
      </div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
    integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="./todo-list.js"></script>
</body>

</html>
