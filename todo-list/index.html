<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo List - tools.gavin.cloud</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
      integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script>
      try {
        const theme = JSON.parse(
          localStorage.getItem("site-theme") || "{}",
        ).theme;
        if (theme) document.documentElement.dataset.bsTheme = theme;
      } catch (e) {}
    </script>
  </head>

  <body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">
          <img
            src="/assets/svg/logo.svg"
            width="30"
            height="30"
            class="bi bi-tools me-2"
          />
          tools.gavin.cloud
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-sm-0">
            <li class="nav-item">
              <button type="button" class="nav-link me-2" id="theme-toggle">
                <img
                  src="/assets/svg/theme-light-dark.svg"
                  width="18"
                  height="18"
                  class="me-1"
                />
                Theme
              </button>
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="https://github.com/GavinEke/tools"
                target="_blank"
                rel="noopener"
              >
                <img
                  src="/assets/svg/GitHub.svg"
                  width="18"
                  height="18"
                  class="me-1"
                />
                GitHub
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <div class="mb-4">
            <h1 class="display-5 fw-bold text-body-emphasis">Todo List</h1>
            <p class="text-body-secondary">
              Create and manage your tasks with persistent storage.
            </p>
          </div>

          <div class="card mb-4">
            <div class="card-body">
              <div class="mb-3">
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control"
                    id="new-todo-input"
                    placeholder="Add a new task..."
                    maxlength="200"
                  />
                  <button
                    class="btn btn-primary"
                    type="button"
                    id="add-todo-btn"
                  >
                    Add Task
                  </button>
                </div>
              </div>

              <div class="mb-3">
                <div class="btn-group-sm" role="group">
                  <input
                    type="radio"
                    class="btn-check"
                    name="filter"
                    id="filter-all"
                    autocomplete="off"
                    checked
                  />
                  <label class="btn btn-outline-secondary" for="filter-all"
                    >All</label
                  >
                  <input
                    type="radio"
                    class="btn-check"
                    name="filter"
                    id="filter-active"
                    autocomplete="off"
                  />
                  <label class="btn btn-outline-secondary" for="filter-active"
                    >Active</label
                  >
                  <input
                    type="radio"
                    class="btn-check"
                    name="filter"
                    id="filter-completed"
                    autocomplete="off"
                  />
                  <label
                    class="btn btn-outline-secondary"
                    for="filter-completed"
                    >Completed</label
                  >
                </div>
                <div class="float-end">
                  <button
                    class="btn btn-outline-danger btn-sm"
                    id="clear-completed-btn"
                  >
                    Clear Completed
                  </button>
                </div>
              </div>

              <div id="todo-list" class="list-group">
                <!-- Todos will be inserted here -->
              </div>

              <div id="empty-state" class="text-center text-muted py-5 d-none">
                <p class="mb-0">No tasks yet. Add one above to get started!</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-4 mt-auto">
      <div class="container">
        <div class="text-center">
          <span class="text-body-secondary small"
            >Made with AI & ❤️ by
            <a href="https://gavineke.com" target="_blank" rel="noopener"
              >Gavin Eke</a
            ></span
          >
        </div>
      </div>
    </footer>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
      integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
