</head>

                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z" />

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-md-12">
        <div class="mb-4">
          <h1 class="display-5 fw-bold text-body-emphasis">CSV to JSON Converter</h1>
          <p class="text-body-secondary">Convert CSV data to JSON format with customizable parsing options.</p>
        </div>

        <div class="row">
          <div class="col-lg-6">
            <div class="card mb-4">
              <div class="card-body">
                <h5 class="card-title mb-3">CSV Input</h5>

                <ul class="nav nav-tabs mb-3" id="input-tabs" role="tablist">
                  <li class="nav-item">
                    <button class="nav-link active" id="text-tab" data-bs-toggle="tab" data-bs-target="#text-pane"
                      type="button">Text</button>
                  </li>
                  <li class="nav-item">
                    <button class="nav-link" id="file-tab" data-bs-toggle="tab" data-bs-target="#file-pane"
                      type="button">File</button>
                  </li>
                </ul>

                <div class="tab-content" id="input-tabs-content">
                  <div class="tab-pane fade show active" id="text-pane" role="tabpanel">
                    <label for="csv-input" class="form-label fw-medium">CSV Data</label>
                    <textarea class="form-control font-monospace" id="csv-input" rows="8"
                      placeholder="Paste your CSV data here"></textarea>
                  </div>
                  <div class="tab-pane fade" id="file-pane" role="tabpanel">
                    <label for="csv-file" class="form-label fw-medium">Select CSV File</label>
                    <input type="file" class="form-control" id="csv-file" accept=".csv,.txt">
                    <div id="file-info" class="mt-2 text-body-secondary small d-none"></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="card mb-4">
              <div class="card-body">
                <h5 class="card-title mb-3">Options</h5>
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="delimiter" class="form-label fw-medium">Delimiter</label>
                      <select class="form-select" id="delimiter">
                        <option value=",">Comma (,)</option>
                        <option value=";">Semicolon (;)</option>
                        <option value="\t">Tab</option>
                        <option value="|">Pipe (|)</option>
                        <option value=" ">Space</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="quote-char" class="form-label fw-medium">Quote Character</label>
                      <select class="form-select" id="quote-char">
                        <option value='"'>Double Quote (")</option>
                        <option value="'">Single Quote (')</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="form-check mb-3">
                  <input class="form-check-input" type="checkbox" id="has-header" checked>
                  <label class="form-check-label" for="has-header">
                    First row contains headers
                  </label>
                </div>
                <div class="form-check mb-3">
                  <input class="form-check-input" type="checkbox" id="skip-empty">
                  <label class="form-check-label" for="skip-empty">
                    Skip empty rows
                  </label>
                </div>
                <div class="mb-3">
                  <label for="indentation" class="form-label fw-medium">JSON Indentation</label>
                  <select class="form-select" id="indentation">
                    <option value="2">2 spaces</option>
                    <option value="4">4 spaces</option>
                    <option value="tab">Tab</option>
                    <option value="minified">Minified</option>
                  </select>
                </div>
                <div class="d-flex gap-2">
                  <button type="button" class="btn btn-primary" id="convert-btn">Convert</button>
                  <button type="button" class="btn btn-outline-secondary" id="clear-btn">Clear</button>
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="card mb-4">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h5 class="card-title mb-0">JSON Output</h5>
                  <div class="btn-group btn-group-sm">
                    <button type="button" class="btn btn-outline-secondary" id="copy-btn" title="Copy to clipboard">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        viewBox="0 0 16 16">
                        <path
                          d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z" />
                        <path
                          d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z" />
                      </svg>
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="download-btn" title="Download JSON">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        viewBox="0 0 16 16">
                        <path
                          d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z" />
                        <path
                          d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 1 .708-.708l3 3z" />
                      </svg>
                    </button>
                  </div>
                </div>
                <div id="json-output-container">
                  <pre id="json-output"
                    class="bg-light p-3 rounded font-monospace small text-body-secondary">JSON output will appear here</pre>
                </div>
                <div id="conversion-stats" class="mt-3 text-body-secondary small d-none"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
