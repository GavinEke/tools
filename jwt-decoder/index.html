<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>

<body>
  <nav class="navbar navbar-expand-sm navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="bi bi-tools me-2">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 2a4.5 4.5 0 0 0 0 9 4.5 4.5 0 0 0 0-9z" />
          <path d="M8 8l8-4 1 2-3 6-2-1Z" />
          <path d="M4 11l2 1" />
          <path d="M14 8l-2 4" />
        </svg>
        tools.gavin.cloud
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-sm-0">
          <li class="nav-item">
            <a class="nav-link" href="https://github.com/GavinEke/tools" target="_blank" rel="noopener">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"
                class="me-1">
                <path
                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
              </svg>
              GitHub
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="mb-4">
          <h1 class="display-5 fw-bold text-body-emphasis">JWT Decoder</h1>
          <p class="text-body-secondary">Decode and inspect JSON Web Tokens (JWT) to view header and payload data.</p>
        </div>

        <div class="card mb-4">
          <div class="card-body">
            <label for="jwt-input" class="form-label fw-medium">JWT Token</label>
            <textarea class="form-control font-monospace" id="jwt-input" rows="4"
              placeholder="Paste your JWT token here (eyJ...)"></textarea>
            <div class="mt-3 d-flex gap-2">
              <button type="button" class="btn btn-primary" id="decode-btn">Decode Token</button>
              <button type="button" class="btn btn-outline-secondary" id="clear-btn">Clear</button>
            </div>
          </div>
        </div>

        <div id="error-container" class="alert alert-danger d-none mb-4" role="alert"></div>

        <div id="decoded-result" class="d-none">
          <div class="card mb-4">
            <div class="card-header bg-transparent">
              <ul class="nav nav-tabs card-header-tabs" id="jwt-tabs" role="tablist">
                <li class="nav-item">
                  <button class="nav-link active" id="header-tab" data-bs-toggle="tab" data-bs-target="#header-pane"
                    type="button" role="tab">Header</button>
                </li>
                <li class="nav-item">
                  <button class="nav-link" id="payload-tab" data-bs-toggle="tab" data-bs-target="#payload-pane"
                    type="button" role="tab">Payload</button>
                </li>
                <li class="nav-item">
                  <button class="nav-link" id="signature-tab" data-bs-toggle="tab" data-bs-target="#signature-pane"
                    type="button" role="tab">Signature</button>
                </li>
              </ul>
            </div>
            <div class="card-body">
              <div class="tab-content" id="jwt-tabs-content">
                <div class="tab-pane fade show active" id="header-pane" role="tabpanel">
                  <pre class="mb-0"><code class="language-json" id="header-code"></code></pre>
                </div>
                <div class="tab-pane fade" id="payload-pane" role="tabpanel">
                  <pre class="mb-0"><code class="language-json" id="payload-code"></code></pre>
                </div>
                <div class="tab-pane fade" id="signature-pane" role="tabpanel">
                  <pre class="mb-0"><code class="font-monospace" id="signature-code"></code></pre>
                </div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Token Information</h5>
              <div class="table-responsive">
                <table class="table table-borderless mb-0">
                  <tbody id="token-info-table">
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-auto">
    <div class="container">
      <div class="text-center">
        <span class="text-body-secondary small">Made with AI & ❤️ by <a href="https://gavineke.com" target="_blank"
            rel="noopener">Gavin Eke</a></span>
      </div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"

    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="./jwt-decoder.js"></script>
</body>

</html>
