<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Diff Tool - tools.gavin.cloud</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
    integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .diff-added {
      background-color: #d4edda;
      border-left: 4px solid #28a745;
    }

    .diff-removed {
      background-color: #f8d7da;
      border-left: 4px solid #dc3545;
    }

    .diff-unchanged {
      background-color: #f8f9fa;
      border-left: 4px solid #6c757d;
    }

    .diff-line {
      padding: 4px 8px;
      margin: 2px 0;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
    }

    .diff-controls {
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-sm navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="bi bi-tools me-2">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 2a4.5 4.5 0 0 0 0 9 4.5 4.5 0 0 0 0-9z" />
          <path d="M8 8l8-4 1 2-3 6-2-1Z" />
          <path d="M4 11l2 1" />
          <path d="M14 8l-2 4" />
        </svg>
        tools.gavin.cloud
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-sm-0">
          <li class="nav-item">
            <a class="nav-link" href="/">All Tools</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="https://github.com/GavinEke/tools" target="_blank" rel="noopener">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"
                class="me-1">
                <path
                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
              </svg>
              GitHub
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="mb-4">
      <h1 class="display-5 fw-bold text-body-emphasis">Text Diff Tool</h1>
      <p class="text-body-secondary">Compare two text strings and see the differences highlighted.</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card h-100">
          <div class="card-header bg-transparent py-3">
            <h2 class="h5 mb-0 fw-semibold">Original Text</h2>
          </div>
          <div class="card-body">
            <textarea class="form-control font-monospace" id="original-text" rows="12"
              placeholder="Paste or type the original text here..."></textarea>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card h-100">
          <div class="card-header bg-transparent py-3">
            <h2 class="h5 mb-0 fw-semibold">Modified Text</h2>
          </div>
          <div class="card-body">
            <textarea class="form-control font-monospace" id="modified-text" rows="12"
              placeholder="Paste or type the modified text here..."></textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="diff-controls">
      <button type="button" class="btn btn-primary" id="diff-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
          class="bi bi-arrow-left-right me-1" viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M1 11.5a.5.5 0 0 0 .5.5h11.793l-3.147 3.146a.5.5 0 0 0 .708.708l4-4a.5.5 0 0 0 0-.708l-4-4a.5.5 0 0 0-.708.708L13.293 11H1.5a.5.5 0 0 0-.5.5zm14-7a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 5H14.5a.5.5 0 0 0 .5-.5z" />
        </svg>
        Compare Texts
      </button>
      <button type="button" class="btn btn-outline-secondary ms-2" id="swap-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
          class="bi bi-arrow-repeat me-1" viewBox="0 0 16 16">
          <path
            d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z" />
          <path fill-rule="evenodd"
            d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z" />
        </svg>
        Swap Texts
      </button>
      <button type="button" class="btn btn-outline-secondary ms-2" id="clear-btn">Clear All</button>
    </div>

    <div class="card">
      <div class="card-header bg-transparent py-3 d-flex justify-content-between align-items-center">
        <h2 class="h5 mb-0 fw-semibold">Differences</h2>
        <div class="btn-group btn-group-sm" role="group">
          <button type="button" class="btn btn-outline-success active" id="show-added">Added</button>
          <button type="button" class="btn btn-outline-danger active" id="show-removed">Removed</button>
          <button type="button" class="btn btn-outline-secondary active" id="show-unchanged">Unchanged</button>
        </div>
      </div>
      <div class="card-body">
        <div id="diff-output" class="diff-container">
          <div class="text-muted text-center py-4">
            Click "Compare Texts" to see the differences.
          </div>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card">
            <div class="card-body text-center">
              <h5 class="card-title text-success">Added Lines</h5>
              <p class="card-text display-4 fw-bold text-success" id="stats-added">0</p>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <div class="card-body text-center">
              <h5 class="card-title text-danger">Removed Lines</h5>
              <p class="card-text display-4 fw-bold text-danger" id="stats-removed">0</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-auto">
    <div class="container">
      <div class="text-center">
        <span class="text-body-secondary small">Made with AI & ❤️ by <a href="https://gavineke.com" target="_blank"
            rel="noopener">Gavin Eke</a></span>
      </div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
    integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="./text-diff.js"></script>
</body>

</html>
