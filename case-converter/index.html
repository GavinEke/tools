<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Case Converter - tools.gavin.cloud</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
      integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script>
      try {
        const theme = JSON.parse(
          localStorage.getItem("site-theme") || "{}",
        ).theme;
        if (theme) document.documentElement.dataset.bsTheme = theme;
      } catch (e) {}
    </script>
  </head>

  <body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">
          <img
            src="/assets/svg/logo.svg"
            width="30"
            height="30"
            class="bi bi-tools me-2"
          />
          tools.gavin.cloud
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-sm-0">
            <li class="nav-item">
              <button type="button" class="nav-link me-2" id="theme-toggle">
                <img
                  src="/assets/svg/theme-light-dark.svg"
                  width="18"
                  height="18"
                  class="me-1"
                />
                Theme
              </button>
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="https://github.com/GavinEke/tools"
                target="_blank"
                rel="noopener"
              >
                <img
                  src="/assets/svg/GitHub.svg"
                  width="18"
                  height="18"
                  class="me-1"
                />
                GitHub
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <div class="mb-4">
            <h1 class="display-5 fw-bold text-body-emphasis">Case Converter</h1>
            <p class="text-body-secondary">
              Convert text between different case formats: uppercase, lowercase,
              title case, camel case, and more.
            </p>
          </div>

          <div class="card mb-4">
            <div class="card-body">
              <div class="mb-3">
                <label for="input-text" class="form-label fw-medium"
                  >Input Text</label
                >
                <textarea
                  class="form-control font-monospace"
                  id="input-text"
                  rows="4"
                  placeholder="Enter text to convert"
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="case-select" class="form-label fw-medium"
                  >Case Format</label
                >
                <select class="form-select" id="case-select">
                  <option value="uppercase">Uppercase</option>
                  <option value="lowercase">Lowercase</option>
                  <option value="title-case">Title Case</option>
                  <option value="camel-case">Camel Case</option>
                  <option value="pascal-case">Pascal Case</option>
                  <option value="snake-case">Snake Case</option>
                  <option value="kebab-case">Kebab Case</option>
                  <option value="constant-case">Constant Case</option>
                </select>
              </div>
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-primary" id="convert-btn">
                  Convert
                </button>
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  id="clear-btn"
                >
                  Clear
                </button>
              </div>
            </div>
          </div>

          <div id="output-section" class="d-none">
            <div class="card">
              <div class="card-body">
                <div
                  class="d-flex justify-content-between align-items-center mb-3"
                >
                  <h5 class="card-title mb-0">Converted Text</h5>
                  <button
                    type="button"
                    class="btn btn-sm btn-outline-primary"
                    id="copy-btn"
                  >
                    Copy
                  </button>
                </div>
                <textarea
                  class="form-control font-monospace"
                  id="output-text"
                  rows="4"
                  readonly
                ></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-4 mt-auto">
      <div class="container">
        <div class="text-center">
          <span class="text-body-secondary small"
            >Made with AI & ❤️ by
            <a href="https://gavineke.com" target="_blank" rel="noopener"
              >Gavin Eke</a
            ></span
          >
        </div>
      </div>
    </footer>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
      integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
