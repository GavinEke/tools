                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z" />

  <main class="container py-5">
    <div class="mb-4">
      <h1 class="display-5 fw-bold text-body-emphasis">DNS Lookup</h1>
      <p class="text-body-secondary">Look up DNS records for domain names including A, CNAME, MX, and other record
        types.</p>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-6">
            <label for="domain-input" class="form-label fw-medium">Domain Name</label>
            <input type="text" class="form-control" id="domain-input"
              placeholder="Enter domain name (e.g., example.com)">
          </div>
          <div class="col-md-4">
            <label for="record-type" class="form-label fw-medium">Record Type</label>
            <select class="form-select" id="record-type">
              <option value="A">A (Address)</option>
              <option value="AAAA">AAAA (IPv6 Address)</option>
              <option value="CNAME">CNAME (Canonical Name)</option>
              <option value="MX">MX (Mail Exchange)</option>
              <option value="TXT">TXT (Text)</option>
              <option value="NS">NS (Name Server)</option>
              <option value="SOA">SOA (Start of Authority)</option>
            </select>
          </div>
          <div class="col-md-2">
            <button type="button" class="btn btn-primary w-100" id="lookup-btn">Look Up</button>
          </div>
        </div>
      </div>
    </div>

    <div id="loading" class="text-center py-5 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-3 text-body-secondary">Looking up DNS records...</p>
    </div>

    <div id="error" class="alert alert-danger d-none"></div>

    <div id="results" class="d-none">
      <div class="card">
        <div class="card-header bg-transparent py-3">
          <h2 class="h5 mb-0 fw-semibold">DNS Records</h2>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th scope="col" class="ps-4">Type</th>
                <th scope="col">Name</th>
                <th scope="col">TTL</th>
                <th scope="col">Data</th>
              </tr>
            </thead>
            <tbody id="records-table">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-auto">
    <div class="container">
      <div class="text-center">
        <span class="text-body-secondary small">Made with AI & ❤️ by <a href="https://gavineke.com" target="_blank"
            rel="noopener">Gavin Eke</a></span>
      </div>
    </div>
