<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnet Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            flex-shrink: 0;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #4a90d9;
        }
        .row {
            display: flex;
            gap: 16px;
        }
        .col {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #4a90d9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #3a7bc8;
        }
        #result {
            margin-top: 30px;
            display: none;
        }
        #result.show {
            display: block;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-label {
            color: #666;
            font-weight: 500;
        }
        .result-value {
            color: #333;
            font-family: 'Monaco', 'Menlo', monospace;
            font-weight: 500;
        }
        .error {
            color: #d9534f;
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background-color: #fdf2f2;
            border-radius: 6px;
            display: none;
        }
        .error.show {
            display: block;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            flex-shrink: 0;
        }
        .footer a {
            color: #4a90d9;
            text-decoration: none;
            font-size: 14px;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Subnet Calculator</h1>
        <div class="input-group">
            <label for="ip">IP Address</label>
            <input type="text" id="ip" placeholder="e.g., 192.168.1.100" pattern="^(\d{1,3}\.){3}\d{1,3}$">
        </div>
        <div class="row">
            <div class="col">
                <div class="input-group">
                    <label for="cidr">CIDR</label>
                    <input type="number" id="cidr" min="0" max="32" placeholder="e.g., 24" value="24">
                </div>
            </div>
        </div>
        <button id="calculate">Calculate</button>
        <div id="error" class="error"></div>
        <div id="result">
            <div class="result-item">
                <span class="result-label">Network Address</span>
                <span class="result-value" id="network"></span>
            </div>
            <div class="result-item">
                <span class="result-label">Broadcast Address</span>
                <span class="result-value" id="broadcast"></span>
            </div>
            <div class="result-item">
                <span class="result-label">Subnet Mask</span>
                <span class="result-value" id="mask"></span>
            </div>
            <div class="result-item">
                <span class="result-label">Host Range</span>
                <span class="result-value" id="range"></span>
            </div>
            <div class="result-item">
                <span class="result-label">Number of Hosts</span>
                <span class="result-value" id="hosts"></span>
            </div>
        </div>
    </div>
    <div class="footer">
        <a href="../index.html">← Back to all tools</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
