<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools - Collection of Useful Utilities</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header>
    <h1>Tools</h1>
    <p>A collection of useful utilities built with pure HTML + JavaScript</p>
  </header>

  <main>
    <div class="search-container">
      <input
        type="text"
        id="search"
        placeholder="Search tools by name, description, or tags..."
        autocomplete="off"
      >
    </div>

    <div id="tools-list" class="tools-grid">
      <div id="loading">Loading tools...</div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
