    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <div class="mb-4">
            <h1 class="display-5 fw-bold text-body-emphasis">Hash Generator</h1>
            <p class="text-body-secondary">
              Generate hash values from text or file input using various
              algorithms.
            </p>
          </div>

          <div class="card mb-4">
            <div class="card-body">
              <ul class="nav nav-tabs mb-3" id="input-tabs" role="tablist">
                <li class="nav-item">
                  <button
                    class="nav-link active"
                    id="text-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#text-pane"
                    type="button"
                  >
                    Text
                  </button>
                </li>
                <li class="nav-item">
                  <button
                    class="nav-link"
                    id="file-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#file-pane"
                    type="button"
                  >
                    File
                  </button>
                </li>
              </ul>
              <div class="tab-content" id="input-tabs-content">
                <div
                  class="tab-pane fade show active"
                  id="text-pane"
                  role="tabpanel"
                >
                  <label for="hash-input" class="form-label fw-medium"
                    >Input Text</label
                  >
                  <textarea
                    class="form-control font-monospace"
                    id="hash-input"
                    rows="4"
                    placeholder="Enter text to hash"
                  ></textarea>
                </div>
                <div class="tab-pane fade" id="file-pane" role="tabpanel">
                  <label for="file-input" class="form-label fw-medium"
                    >Select File</label
                  >
                  <input type="file" class="form-control" id="file-input" />
                  <div
                    id="file-info"
                    class="mt-2 text-body-secondary small d-none"
                  ></div>
                </div>
              </div>
              <div class="mt-3 d-flex gap-2">
                <button type="button" class="btn btn-primary" id="generate-btn">
                  Generate Hashes
                </button>
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  id="clear-btn"
                >
                  Clear
                </button>
              </div>
            </div>
          </div>

          <div id="hash-results" class="d-none">
            <div class="card mb-4">
              <div class="card-body">
                <h5 class="card-title mb-3">Hash Results</h5>
                <div id="hash-outputs"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-4 mt-auto">
      <div class="container">
        <div class="text-center">
          <span class="text-body-secondary small"
            >Made with AI & ❤️ by
            <a href="https://gavineke.com" target="_blank" rel="noopener"
              >Gavin Eke</a
            ></span
          >
        </div>
      </div>
    </footer>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
      integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="./hash-generator.js"></script>
  </body>
</html>
