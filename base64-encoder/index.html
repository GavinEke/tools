<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Base64 Encoder/Decoder - tools.gavin.cloud</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
      integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script>
      try {
        const theme = JSON.parse(
          localStorage.getItem("site-theme") || "{}",
        ).theme;
        if (theme) document.documentElement.dataset.bsTheme = theme;
      } catch (e) {}
    </script>
  </head>

  <body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">
          <img
            src="/assets/svg/logo.svg"
            width="30"
            height="30"
            class="bi bi-tools me-2"
          />
          tools.gavin.cloud
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-sm-0">
            <li class="nav-item">
              <button type="button" class="nav-link me-2" id="theme-toggle">
                <img
                  src="/assets/svg/theme-light-dark.svg"
                  width="18"
                  height="18"
                  class="me-1"
                />
                Theme
              </button>
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="https://github.com/GavinEke/tools"
                target="_blank"
                rel="noopener"
              >
                <img
                  src="/assets/svg/GitHub.svg"
                  width="18"
                  height="18"
                  class="me-1"
                />
                GitHub
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-10 col-md-12">
          <div class="mb-4">
            <h1 class="display-5 fw-bold text-body-emphasis">
              Base64 Encoder/Decoder
            </h1>
            <p class="text-body-secondary">
              Encode text or files to Base64 format, or decode Base64 strings
              back to their original form.
            </p>
          </div>

          <ul
            class="nav nav-pills mb-4 justify-content-center"
            id="mode-tabs"
            role="tablist"
          >
            <li class="nav-item" role="presentation">
              <button
                class="nav-link active"
                id="encode-tab"
                data-bs-toggle="pill"
                data-bs-target="#encode-pane"
                type="button"
                role="tab"
                aria-controls="encode-pane"
                aria-selected="true"
              >
                Encode
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="decode-tab"
                data-bs-toggle="pill"
                data-bs-target="#decode-pane"
                type="button"
                role="tab"
                aria-controls="decode-pane"
                aria-selected="false"
              >
                Decode
              </button>
            </li>
          </ul>

          <div class="tab-content" id="mode-tabs-content">
            <div
              class="tab-pane fade show active"
              id="encode-pane"
              role="tabpanel"
              aria-labelledby="encode-tab"
            >
              <div class="row">
                <div class="col-lg-6">
                  <div class="card mb-4">
                    <div class="card-body">
                      <h5 class="card-title mb-3">Input</h5>

                      <ul
                        class="nav nav-tabs mb-3"
                        id="encode-input-tabs"
                        role="tablist"
                      >
                        <li class="nav-item">
                          <button
                            class="nav-link active"
                            id="encode-text-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#encode-text-pane"
                            type="button"
                          >
                            Text
                          </button>
                        </li>
                        <li class="nav-item">
                          <button
                            class="nav-link"
                            id="encode-file-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#encode-file-pane"
                            type="button"
                          >
                            File
                          </button>
                        </li>
                      </ul>

                      <div class="tab-content" id="encode-input-tabs-content">
                        <div
                          class="tab-pane fade show active"
                          id="encode-text-pane"
                          role="tabpanel"
                        >
                          <label
                            for="encode-text-input"
                            class="form-label fw-medium"
                            >Text to Encode</label
                          >
                          <textarea
                            class="form-control font-monospace"
                            id="encode-text-input"
                            rows="8"
                            placeholder="Enter text to encode to Base64"
                          ></textarea>
                        </div>
                        <div
                          class="tab-pane fade"
                          id="encode-file-pane"
                          role="tabpanel"
                        >
                          <label
                            for="encode-file-input"
                            class="form-label fw-medium"
                            >Select File</label
                          >
                          <input
                            type="file"
                            class="form-control"
                            id="encode-file-input"
                          />
                          <div
                            id="encode-file-info"
                            class="mt-2 text-body-secondary small d-none"
                          ></div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="d-flex gap-2">
                    <button
                      type="button"
                      class="btn btn-primary"
                      id="encode-btn"
                    >
                      Encode
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-secondary"
                      id="encode-clear-btn"
                    >
                      Clear
                    </button>
                  </div>
                </div>

                <div class="col-lg-6">
                  <div class="card mb-4">
                    <div class="card-body">
                      <div
                        class="d-flex justify-content-between align-items-center mb-3"
                      >
                        <h5 class="card-title mb-0">Base64 Output</h5>
                        <div class="btn-group btn-group-sm">
                          <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="encode-copy-btn"
                            title="Copy to clipboard"
                          >
                            <svg
                              xmlns="http://www.w3.org/2000/svg"
                              width="16"
                              height="16"
                              fill="currentColor"
                              viewBox="0 0 16 16"
                            >
                              <path
                                d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"
                              />
                              <path
                                d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"
                              />
                            </svg>
                          </button>
                          <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="encode-download-btn"
                            title="Download Base64"
                          >
                            <svg
                              xmlns="http://www.w3.org/2000/svg"
                              width="16"
                              height="16"
                              fill="currentColor"
                              viewBox="0 0 16 16"
                            >
                              <path
                                d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"
                              />
                              <path
                                d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 0 1 .708-.708l3 3z"
                              />
                            </svg>
                          </button>
                        </div>
                      </div>
                      <div id="encode-output-container">
                        <pre
                          id="encode-output"
                          class="bg-body p-3 rounded font-monospace small text-body-secondary"
                        >
Base64 output will appear here</pre
                        >
                      </div>
                      <div
                        id="encode-stats"
                        class="mt-3 text-body-secondary small d-none"
                      ></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div
              class="tab-pane fade"
              id="decode-pane"
              role="tabpanel"
              aria-labelledby="decode-tab"
            >
              <div class="row">
                <div class="col-lg-6">
                  <div class="card mb-4">
                    <div class="card-body">
                      <h5 class="card-title mb-3">Base64 Input</h5>
                      <label for="decode-input" class="form-label fw-medium"
                        >Base64 String to Decode</label
                      >
                      <textarea
                        class="form-control font-monospace"
                        id="decode-input"
                        rows="8"
                        placeholder="Enter Base64 string to decode"
                      ></textarea>
                    </div>
                  </div>

                  <div class="d-flex gap-2">
                    <button
                      type="button"
                      class="btn btn-primary"
                      id="decode-btn"
                    >
                      Decode
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-secondary"
                      id="decode-clear-btn"
                    >
                      Clear
                    </button>
                  </div>
                </div>

                <div class="col-lg-6">
                  <div class="card mb-4">
                    <div class="card-body">
                      <div
                        class="d-flex justify-content-between align-items-center mb-3"
                      >
                        <h5 class="card-title mb-0">Decoded Output</h5>
                        <div class="btn-group btn-group-sm">
                          <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="decode-copy-btn"
                            title="Copy to clipboard"
                          >
                            <svg
                              xmlns="http://www.w3.org/2000/svg"
                              width="16"
                              height="16"
                              fill="currentColor"
                              viewBox="0 0 16 16"
                            >
                              <path
                                d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"
                              />
                              <path
                                d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"
                              />
                            </svg>
                          </button>
                          <button
                            type="button"
                            class="btn btn-outline-secondary d-none"
                            id="decode-download-btn"
                            title="Download as binary file"
                          >
                            <svg
                              xmlns="http://www.w3.org/2000/svg"
                              width="16"
                              height="16"
                              fill="currentColor"
                              viewBox="0 0 16 16"
                            >
                              <path
                                d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"
                              />
                              <path
                                d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 0 1 .708-.708l3 3z"
                              />
                            </svg>
                          </button>
                        </div>
                      </div>
                      <div id="decode-output-container">
                        <pre
                          id="decode-output"
                          class="bg-body p-3 rounded font-monospace small text-body-secondary"
                        >
Decoded output will appear here</pre
                        >
                      </div>
                      <div
                        id="decode-stats"
                        class="mt-3 text-body-secondary small d-none"
                      ></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-4 mt-auto">
      <div class="container">
        <div class="text-center">
          <span class="text-body-secondary small"
            >Made with AI & ❤️ by
            <a href="https://gavineke.com" target="_blank" rel="noopener"
              >Gavin Eke</a
            ></span
          >
        </div>
      </div>
    </footer>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
      integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
