<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timestamp Converter - tools.gavin.cloud</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
      integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script>
      try {
        const theme = JSON.parse(
          localStorage.getItem("site-theme") || "{}",
        ).theme;
        if (theme) document.documentElement.dataset.bsTheme = theme;
      } catch (e) {}
    </script>
  </head>

  <body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">
          <img
            src="/assets/svg/logo.svg"
            width="30"
            height="30"
            class="bi bi-tools me-2"
          />
          tools.gavin.cloud
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-sm-0">
            <li class="nav-item">
              <button type="button" class="nav-link me-2" id="theme-toggle">
                <img
                  src="/assets/svg/theme-light-dark.svg"
                  width="18"
                  height="18"
                  class="me-1"
                />
                Theme
              </button>
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="https://github.com/GavinEke/tools"
                target="_blank"
                rel="noopener"
              >
                <img
                  src="/assets/svg/GitHub.svg"
                  width="18"
                  height="18"
                  class="me-1"
                />
                GitHub
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-10 col-md-12">
          <div class="mb-4">
            <h1 class="display-5 fw-bold text-body-emphasis">
              Timestamp Converter
            </h1>
            <p class="text-body-secondary">
              Convert between Unix timestamps and human-readable dates, and vice
              versa.
            </p>
          </div>

          <ul
            class="nav nav-pills mb-4 justify-content-center"
            id="mode-tabs"
            role="tablist"
          >
            <li class="nav-item" role="presentation">
              <button
                class="nav-link active"
                id="ts-to-date-tab"
                data-bs-toggle="pill"
                data-bs-target="#ts-to-date-pane"
                type="button"
                role="tab"
                aria-controls="ts-to-date-pane"
                aria-selected="true"
              >
                Timestamp to Date
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="date-to-ts-tab"
                data-bs-toggle="pill"
                data-bs-target="#date-to-ts-pane"
                type="button"
                role="tab"
                aria-controls="date-to-ts-pane"
                aria-selected="false"
              >
                Date to Timestamp
              </button>
            </li>
          </ul>

          <div class="tab-content" id="mode-tabs-content">
            <div
              class="tab-pane fade show active"
              id="ts-to-date-pane"
              role="tabpanel"
              aria-labelledby="ts-to-date-tab"
            >
              <div class="row">
                <div class="col-lg-6">
                  <div class="card mb-4">
                    <div class="card-body">
                      <h5 class="card-title mb-3">Timestamp Input</h5>
                      <label for="timestamp-input" class="form-label fw-medium"
                        >Unix Timestamp</label
                      >
                      <input
                        type="number"
                        class="form-control"
                        id="timestamp-input"
                        placeholder="Enter Unix timestamp"
                      />
                      <div class="mt-3">
                        <label class="form-label fw-medium"
                          >Timestamp Type</label
                        >
                        <select class="form-select" id="timestamp-type">
                          <option value="seconds">
                            Seconds (Unix standard)
                          </option>
                          <option value="milliseconds">Milliseconds</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <div class="d-flex gap-2">
                    <button
                      type="button"
                      class="btn btn-primary"
                      id="convert-ts-btn"
                    >
                      Convert
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-secondary"
                      id="current-ts-btn"
                    >
                      Use Current Time
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-secondary"
                      id="clear-ts-btn"
                    >
                      Clear
                    </button>
                  </div>
                </div>

                <div class="col-lg-6">
                  <div class="card mb-4">
                    <div class="card-body">
                      <h5 class="card-title mb-3">Date Output</h5>
                      <div id="date-output">
                        <div class="text-body-secondary">
                          Converted date will appear here
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div
              class="tab-pane fade"
              id="date-to-ts-pane"
              role="tabpanel"
              aria-labelledby="date-to-ts-tab"
            >
              <div class="row">
                <div class="col-lg-6">
                  <div class="card mb-4">
                    <div class="card-body">
                      <h5 class="card-title mb-3">Date Input</h5>
                      <label for="date-input" class="form-label fw-medium"
                        >Date and Time</label
                      >
                      <input
                        type="datetime-local"
                        class="form-control"
                        id="date-input"
                      />
                      <div class="mt-3">
                        <label class="form-label fw-medium"
                          >Or enter ISO 8601 string</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="iso-input"
                          placeholder="YYYY-MM-DDTHH:mm:ss.sssZ"
                        />
                      </div>
                    </div>
                  </div>

                  <div class="d-flex gap-2">
                    <button
                      type="button"
                      class="btn btn-primary"
                      id="convert-date-btn"
                    >
                      Convert
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-secondary"
                      id="now-btn"
                    >
                      Use Current Time
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-secondary"
                      id="clear-date-btn"
                    >
                      Clear
                    </button>
                  </div>
                </div>

                <div class="col-lg-6">
                  <div class="card mb-4">
                    <div class="card-body">
                      <h5 class="card-title mb-3">Timestamp Output</h5>
                      <div id="timestamp-output">
                        <div class="text-body-secondary">
                          Converted timestamps will appear here
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-4 mt-auto">
      <div class="container">
        <div class="text-center">
          <span class="text-body-secondary small"
            >Made with AI & ❤️ by
            <a href="https://gavineke.com" target="_blank" rel="noopener"
              >Gavin Eke</a
            ></span
          >
        </div>
      </div>
    </footer>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
      integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
