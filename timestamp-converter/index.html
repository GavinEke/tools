    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-10 col-md-12">
          <div class="mb-4">
            <h1 class="display-5 fw-bold text-body-emphasis">Timestamp Converter</h1>
            <p class="text-body-secondary">Convert between Unix timestamps and human-readable dates, and vice versa.</p>
          </div>

          <ul class="nav nav-pills mb-4 justify-content-center" id="mode-tabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="ts-to-date-tab" data-bs-toggle="pill" data-bs-target="#ts-to-date-pane" type="button" role="tab" aria-controls="ts-to-date-pane" aria-selected="true">Timestamp to Date</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="date-to-ts-tab" data-bs-toggle="pill" data-bs-target="#date-to-ts-pane" type="button" role="tab" aria-controls="date-to-ts-pane" aria-selected="false">Date to Timestamp</button>
            </li>
          </ul>

          <div class="tab-content" id="mode-tabs-content">
            <div class="tab-pane fade show active" id="ts-to-date-pane" role="tabpanel" aria-labelledby="ts-to-date-tab">
              <div class="row">
                <div class="col-lg-6">
                  <div class="card mb-4">
                    <div class="card-body">
                      <h5 class="card-title mb-3">Timestamp Input</h5>
                      <label for="timestamp-input" class="form-label fw-medium">Unix Timestamp</label>
                      <input type="number" class="form-control" id="timestamp-input" placeholder="Enter Unix timestamp">
                      <div class="mt-3">
                        <label class="form-label fw-medium">Timestamp Type</label>
                        <select class="form-select" id="timestamp-type">
                          <option value="seconds">Seconds (Unix standard)</option>
                          <option value="milliseconds">Milliseconds</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <div class="d-flex gap-2">
                    <button type="button" class="btn btn-primary" id="convert-ts-btn">Convert</button>
                    <button type="button" class="btn btn-outline-secondary" id="current-ts-btn">Use Current Time</button>
                    <button type="button" class="btn btn-outline-secondary" id="clear-ts-btn">Clear</button>
                  </div>
                </div>

                <div class="col-lg-6">
                  <div class="card mb-4">
                    <div class="card-body">
                      <h5 class="card-title mb-3">Date Output</h5>
                      <div id="date-output">
                        <div class="text-body-secondary">Converted date will appear here</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="tab-pane fade" id="date-to-ts-pane" role="tabpanel" aria-labelledby="date-to-ts-tab">
              <div class="row">
                <div class="col-lg-6">
                  <div class="card mb-4">
                    <div class="card-body">
                      <h5 class="card-title mb-3">Date Input</h5>
                      <label for="date-input" class="form-label fw-medium">Date and Time</label>
                      <input type="datetime-local" class="form-control" id="date-input">
                      <div class="mt-3">
                        <label class="form-label fw-medium">Or enter ISO 8601 string</label>
                        <input type="text" class="form-control" id="iso-input" placeholder="YYYY-MM-DDTHH:mm:ss.sssZ">
                      </div>
                    </div>
                  </div>

                  <div class="d-flex gap-2">
                    <button type="button" class="btn btn-primary" id="convert-date-btn">Convert</button>
                    <button type="button" class="btn btn-outline-secondary" id="now-btn">Use Current Time</button>
                    <button type="button" class="btn btn-outline-secondary" id="clear-date-btn">Clear</button>
                  </div>
                </div>

                <div class="col-lg-6">
                  <div class="card mb-4">
                    <div class="card-body">
                      <h5 class="card-title mb-3">Timestamp Output</h5>
                      <div id="timestamp-output">
                        <div class="text-body-secondary">Converted timestamps will appear here</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
